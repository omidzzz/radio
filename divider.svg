<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="20" viewBox="0 0 600 20" preserveAspectRatio="xMidYMid meet" role="separator" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Lit upper half of each blade: fades in from the outer tip, warmest near the bead -->
    <linearGradient id="blade-top" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0"    style="stop-color:var(--color-gold,#c9a24b)" stop-opacity="0"/>
      <stop offset="0.22" style="stop-color:var(--color-gold,#c9a24b)" stop-opacity=".8"/>
      <stop offset="0.42" stop-color="#e6c978"/>
      <stop offset="0.5"  style="stop-color:var(--color-gold,#c9a24b)"/>
      <stop offset="0.58" stop-color="#e6c978"/>
      <stop offset="0.78" style="stop-color:var(--color-gold,#c9a24b)" stop-opacity=".8"/>
      <stop offset="1"    style="stop-color:var(--color-gold,#c9a24b)" stop-opacity="0"/>
    </linearGradient>
    <!-- Shaded lower half: gives the blade a slight bevel -->
    <linearGradient id="blade-bottom" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0"   stop-color="#8a6a22" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#8a6a22" stop-opacity=".75"/>
      <stop offset="0.5" stop-color="#7a5d1e"/>
      <stop offset="0.75" stop-color="#8a6a22" stop-opacity=".75"/>
      <stop offset="1"   stop-color="#8a6a22" stop-opacity="0"/>
    </linearGradient>

    <!-- Gold bead -->
    <radialGradient id="bead" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0"    stop-color="#fff3cc"/>
      <stop offset="0.3"  stop-color="#e9d4a3"/>
      <stop offset="0.62" style="stop-color:var(--color-gold,#c9a24b)"/>
      <stop offset="1"    stop-color="#6b5019"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="0.9" stdDeviation="0.9" flood-color="#0b2e22" flood-opacity=".35"/>
    </filter>

    <!-- Opens a small gap around the bead so each blade ends in a soft point -->
    <linearGradient id="gapfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#fff"/>
      <stop offset="0.27" stop-color="#000"/>
      <stop offset="0.73" stop-color="#000"/>
      <stop offset="1"    stop-color="#fff"/>
    </linearGradient>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="20">
      <rect x="0" y="0" width="100%" height="20" fill="#fff"/>
      <svg x="50%" y="0" width="1" height="20" overflow="visible" style="overflow:visible">
        <rect x="-22" y="0" width="44" height="20" fill="url(#gapfade)"/>
      </svg>
    </mask>
  </defs>

  <!-- Tapered lines: pointed at the outer ends, thickest toward the center (stretch with width) -->
  <g mask="url(#gap)">
    <svg x="0" y="0" width="100%" height="20" viewBox="0 0 1000 20" preserveAspectRatio="none">
      <!-- upper (lit) half -->
      <path d="M0 10 C 260 10, 340 8.3, 430 8.3 C 475 8.3, 495 9.3, 500 10
               C 505 9.3, 525 8.3, 570 8.3 C 660 8.3, 740 10, 1000 10 Z"
            fill="url(#blade-top)"/>
      <!-- lower (shaded) half -->
      <path d="M0 10 C 260 10, 340 11.7, 430 11.7 C 475 11.7, 495 10.7, 500 10
               C 505 10.7, 525 11.7, 570 11.7 C 660 11.7, 740 10, 1000 10 Z"
            fill="url(#blade-bottom)"/>
    </svg>
  </g>

  <!-- Gold bead -->
  <svg x="50%" y="0" width="1" height="20" overflow="visible" style="overflow:visible">
    <g transform="translate(0 10)">
      <circle r="5.6" fill="url(#bead)" stroke="#6b5019" stroke-width=".4" filter="url(#soft)"/>
      <ellipse cx="-1.7" cy="-2" rx="1.8" ry="1.1" fill="#fff" opacity=".75" transform="rotate(-30 -1.7 -2)"/>
    </g>
  </svg>
</svg>
